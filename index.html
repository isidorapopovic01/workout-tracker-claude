<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Workout Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0B0B0F; --surface:#16161D; --surface-2:#1F1F29; --field:#0F0F14;
  --line:#2A2A36; --line-2:#2E2E3B; --text:#F2F1F7; --muted:#A09DB3;
  --accent:#7C3AED; --accent-hover:#6D28D9; --accent-soft:#C4B5FD; --accent-pale:#DDD6FE;
  --accent-bg:#17121F; --accent-line:#3A2A5C; --accent-chip:#241B36; --accent-strong-line:#4C3880;
  --danger:#FCA5A5; --nav:#101015;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
input:focus{outline:2px solid #8B5CF6;outline-offset:1px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.screen{flex:1;padding:24px 20px 28px;display:flex;flex-direction:column;gap:18px}
.nav{position:sticky;bottom:0;z-index:5;display:flex;justify-content:space-around;align-items:center;background:var(--nav);border-top:1px solid #22222C;padding:6px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--muted);min-width:64px;min-height:48px}
.nav a[aria-current=page]{color:var(--accent-soft)}
.footer{position:sticky;bottom:0;z-index:5;padding:14px 20px calc(18px + env(safe-area-inset-bottom,0px));background:var(--nav);border-top:1px solid #1E1E27}

.display{font-family:"Space Grotesk",Inter,system-ui,sans-serif}
.h1{margin:0;font-family:"Space Grotesk",Inter,sans-serif;font-size:28px;font-weight:700;letter-spacing:-.02em}
.h1s{margin:0;font-family:"Space Grotesk",Inter,sans-serif;font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h2{margin:0;font-family:"Space Grotesk",Inter,sans-serif;font-size:28px;font-weight:700;letter-spacing:-.01em}
.h3{margin:0;font-size:16px;font-weight:600}
.m0{margin:0}
.muted{color:var(--muted)}
.xs{font-size:12px}.small{font-size:13px}.base{font-size:14px}
.strong{font-weight:600}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--accent-soft);text-transform:uppercase}
.label{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.baseline{align-items:baseline}
.stack{display:flex;flex-direction:column}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.card.accent{background:var(--accent-bg);border-color:var(--accent-line)}
.hero{border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:16px}
.stat .num{font-family:"Space Grotesk",sans-serif;font-size:26px;font-weight:700}
.stat .unit{font-size:14px;font-weight:500;color:var(--muted)}

.btn{height:48px;border-radius:14px;border:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;padding:0 16px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{background:transparent;border:1px solid var(--line-2);color:var(--text);font-weight:500}
.btn-ghost:hover{background:var(--surface)}
.btn-soft{background:var(--accent-chip);border:1px solid var(--accent-strong-line);color:var(--accent-pale);font-weight:500}
.btn-sm{height:44px;font-size:14px;border-radius:12px}
.btn-lg{height:56px;font-size:16px;border-radius:16px;width:100%}
.btn-block{width:100%}
.icon-btn{width:44px;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text)}
.plain-btn{background:transparent;border:none;padding:0;text-align:left;color:inherit}

.chip{font-size:12px;padding:6px 10px;border-radius:999px;background:var(--accent-chip);color:var(--accent-pale)}
.chip.dim{color:var(--muted)}
.badge{font-size:10px;font-weight:600;letter-spacing:.08em;padding:3px 7px;border-radius:6px;background:var(--accent);color:#fff}
.tag{font-size:11px;color:var(--muted);background:var(--surface-2);padding:4px 8px;border-radius:8px;flex-shrink:0}
.pill{height:40px;padding:0 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:#D4D2DE;font-size:14px;font-weight:500}
.pill[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}

.field{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.input{height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--field);color:var(--text);font-size:15px;padding:0 12px;width:100%;text-transform:none;letter-spacing:0}
.input.num{text-align:center;font-weight:600;font-size:17px;padding:0 6px}
.inline-field{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);letter-spacing:.06em;background:var(--field);border:1px solid var(--line-2);border-radius:10px;padding:0 8px;height:42px}
.inline-field input{flex:1;min-width:0;height:38px;border:none;background:transparent;font-size:15px;font-weight:600;text-align:right;outline-offset:0}

.link-card{display:flex;align-items:center;gap:14px}
.link-card .ic{width:48px;height:48px;border-radius:14px;background:var(--accent-chip);color:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.link-card:hover{border-color:#3A3A48}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week .d{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.week .c{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.week .c.done{background:var(--accent);color:#fff}
.week .c.today{background:transparent;border:2px solid var(--accent-soft);color:var(--text)}
.week .c.planned{background:transparent;border:1px dashed #5B5670;color:var(--text)}

.top{padding:20px 20px 16px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid #1E1E27}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .2s ease}
.timer{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}

.ex{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line)}
.ex.done{background:var(--accent-bg);border-color:var(--accent-strong-line)}
.check{width:44px;height:44px;flex-shrink:0;border-radius:22px;display:flex;align-items:center;justify-content:center;padding:0;background:transparent;border:2px solid #4A4759}
.ex.done .check{background:var(--accent);border-color:var(--accent)}
.ex .name{font-size:16px;font-weight:600}
.ex.done .name{color:var(--accent-pale)}

.cal{padding:14px 12px 12px;display:flex;flex-direction:column;gap:10px;border-radius:22px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-head{text-align:center;font-size:11px;color:var(--muted);font-weight:500}
.day{height:46px;border-radius:12px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;color:#E4E2EE;padding:0}
.day:hover{background:var(--surface-2)}
.day.today{border:2px solid var(--accent-soft);font-weight:600;color:var(--text)}
.picking .day{border:1px dashed #5B4A85;background:#1A1622}
.day.sel,.picking .day.sel{background:var(--accent);color:#fff;font-weight:700;border:none}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:3px;display:block}
.day.sel .dots i{background:#fff!important}

.banner{background:var(--accent-chip);border:1px dashed var(--accent-soft);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.empty{border:1px dashed #34343F;border-radius:18px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.wk{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.typebar{width:4px;align-self:stretch;border-radius:2px;flex-shrink:0}
.act{height:44px;border-radius:12px;border:none;background:var(--surface-2);font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
.act:hover{background:#272733}
.act.danger{color:var(--danger)}
.tchip{height:36px;padding:0 12px;border-radius:10px;background:var(--field);border:1px solid var(--line-2);color:var(--muted);font-size:13px;font-weight:500}
.tchip[aria-pressed=true]{background:var(--accent-chip);color:var(--text)}
.tchip.add{background:transparent;color:var(--accent-soft);border:1px dashed #5B4A85;display:inline-flex;align-items:center;gap:4px}
.qchip{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--accent-line);background:var(--field);color:var(--accent-pale);font-size:13px}
.idx{width:26px;height:26px;border-radius:8px;background:var(--accent-chip);color:var(--accent-soft);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mini{width:36px;height:44px;border:none;border-radius:10px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mini.danger{background:var(--surface-2);color:var(--danger)}
.typepill{flex-shrink:0;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--muted)}

.entry{background:var(--surface);border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.entry.new{border-color:var(--accent-strong-line)}
.entry-head{width:100%;background:transparent;border:none;padding:16px;display:flex;align-items:center;gap:14px;text-align:left}
.datebox{width:48px;height:52px;border-radius:14px;background:var(--field);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.datebox .dw{font-size:10px;color:var(--muted);letter-spacing:.08em}
.datebox .dn{font-family:"Space Grotesk",sans-serif;font-size:18px;font-weight:700}
.chev{flex-shrink:0;transition:transform .15s ease}
.chev.open{transform:rotate(180deg)}
.tbl{padding:0 16px 16px}
.tr{display:grid;grid-template-columns:minmax(0,1fr) 72px 92px;gap:8px;font-size:14px;padding:9px 0;border-top:1px solid #1E1E27;font-variant-numeric:tabular-nums}
.tr.th{font-size:11px;color:var(--muted);letter-spacing:.06em;padding:8px 0;border-top-color:#26262F}
.tr .r{text-align:right}
.tr .v{color:var(--accent-soft);font-weight:600}
.tr.skip{color:#6E6B80}
.tr.skip .v{color:#6E6B80;font-weight:500}

.done-mark{width:64px;height:64px;border-radius:32px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.sumbox{background:var(--field);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;align-items:center}
.sumbox b{font-size:20px;font-family:"Space Grotesk",sans-serif}
.sumbox span{font-size:11px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--accent-strong-line);color:var(--text);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';

  /* ---------- helpers ---------- */
  var STORE_KEY = 'workout-tracker-v1';
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function pad(n) { return String(n).padStart(2, '0'); }
  function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fromKey(k) { var p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(k, n) { var d = fromKey(k); d.setDate(d.getDate() + n); return keyOf(d); }
  function today() { return keyOf(new Date()); }
  function fmtShort(k) { var d = fromKey(k); return WD[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3); }
  function fmtLong(k) { var d = fromKey(k); return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function num(v, d) { var x = parseFloat(v); return isNaN(x) ? (d || 0) : x; }
  function r1(n) { return Math.round(n * 10) / 10; }
  function fmtInt(n) { return Math.round(n).toLocaleString('en-US'); }
  function delta(a, b) { var d = r1(a - b); if (d === 0) return '±0'; return (d > 0 ? '+' : '−') + Math.abs(d); }

  /* ---------- icons ---------- */
  function svg(path, size, extra) { return '<svg width="' + (size || 20) + '" height="' + (size || 20) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"' + (extra || '') + '>' + path + '</svg>'; }
  var I = {
    home: function (s) { return svg('<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>', s || 22); },
    cal: function (s) { return svg('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>', s || 22); },
    list: function (s) { return svg('<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>', s || 22); },
    play: function (s) { return '<svg width="' + (s || 18) + '" height="' + (s || 18) + '" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5v14l12-7z"/></svg>'; },
    clock: function (s) { return svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', s || 14); },
    back: function (s) { return svg('<path d="M15 6l-6 6 6 6"/>', s || 20); },
    next: function (s) { return svg('<path d="M9 6l6 6-6 6"/>', s || 20); },
    down: function (s) { return svg('<path d="M6 9l6 6 6-6"/>', s || 20); },
    up: function (s) { return svg('<path d="M6 15l6-6 6 6"/>', s || 16); },
    check: function (s, w) { return '<svg width="' + (s || 18) + '" height="' + (s || 18) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 3) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>'; },
    plus: function (s) { return '<svg width="' + (s || 16) + '" height="' + (s || 16) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>'; },
    edit: function (s) { return svg('<path d="M4 20h4L19 9l-4-4L4 16z"/>', s || 15); },
    copy: function (s) { return svg('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/>', s || 15); },
    move: function (s) { return svg('<path d="M5 9l-3 3 3 3M19 9l3 3-3 3M2 12h20"/>', s || 15); },
    trash: function (s) { return svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>', s || 15); },
    x: function (s) { return svg('<path d="M6 6l12 12M18 6L6 18"/>', s || 16); },
    trend: function (s) { return svg('<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>', s || 20); }
  };

  /* ---------- data ---------- */
  var BASE_TYPES = [
    { name: 'Push', color: '#A78BFA' }, { name: 'Pull', color: '#2DD4BF' }, { name: 'Legs', color: '#FB923C' },
    { name: 'Upper', color: '#F472B6' }, { name: 'Lower', color: '#FACC15' }, { name: 'Full Body', color: '#A3E635' },
    { name: 'Cardio', color: '#60A5FA' }
  ];
  var CUSTOM_COLORS = ['#38BDF8', '#E879F9', '#FDE68A', '#86EFAC', '#FCA5A5', '#93C5FD'];
  var LIB = {
    Push: [['Bench Press', 4, 8, 60], ['Incline DB Press', 3, 10, 22], ['Overhead Press', 3, 8, 40], ['Cable Fly', 3, 12, 15], ['Lateral Raise', 3, 15, 8], ['Triceps Pushdown', 3, 12, 25]],
    Pull: [['Deadlift', 3, 5, 100], ['Pull-up', 4, 8, 0], ['Barbell Row', 4, 8, 55], ['Face Pull', 3, 15, 15], ['Hammer Curl', 3, 12, 14]],
    Legs: [['Back Squat', 4, 6, 80], ['Romanian Deadlift', 3, 10, 60], ['Leg Press', 3, 12, 140], ['Walking Lunge', 3, 12, 16], ['Calf Raise', 4, 15, 40]],
    Cardio: [['Zone 2 Run', 1, 40, 0]]
  };
  var QUICK = {
    Push: ['Bench Press', 'Overhead Press', 'Dips', 'Lateral Raise', 'Triceps Pushdown'],
    Pull: ['Deadlift', 'Pull-up', 'Barbell Row', 'Lat Pulldown', 'Biceps Curl'],
    Legs: ['Back Squat', 'Romanian Deadlift', 'Leg Press', 'Leg Curl', 'Calf Raise'],
    Upper: ['Bench Press', 'Barbell Row', 'Overhead Press', 'Pull-up', 'Biceps Curl'],
    Lower: ['Back Squat', 'Romanian Deadlift', 'Hip Thrust', 'Leg Extension', 'Calf Raise'],
    'Full Body': ['Back Squat', 'Bench Press', 'Deadlift', 'Pull-up', 'Plank'],
    Cardio: ['Zone 2 Run', 'Rowing', 'Cycling', 'Jump Rope']
  };
  var METRICS = [
    { key: 'weight', name: 'Weight', unit: 'kg' }, { key: 'chest', name: 'Chest', unit: 'cm' },
    { key: 'waist', name: 'Waist', unit: 'cm' }, { key: 'hips', name: 'Hips', unit: 'cm' },
    { key: 'arm', name: 'Arm', unit: 'cm' }, { key: 'thigh', name: 'Thigh', unit: 'cm' }
  ];

  var S; // saved state
  function uid() { return S.nextId++; }

  function seed() {
    S = { v: 1, nextId: 1, types: BASE_TYPES.slice(), plans: [], logs: [], metrics: [], session: null };
    var t = today();
    function mkEx(type) { return LIB[type].map(function (e) { return { id: uid(), name: e[0], sets: e[1], reps: e[2], kg: e[3] }; }); }
    [[-8, 'Pull Day', 'Pull'], [-6, 'Push Day', 'Push'], [-4, 'Leg Day', 'Legs'], [-2, 'Pull Day', 'Pull'], [0, 'Push Day', 'Push'],
     [2, 'Pull Day', 'Pull'], [4, 'Leg Day', 'Legs'], [6, 'Push Day', 'Push'], [8, 'Zone 2 Run', 'Cardio']].forEach(function (p) {
      S.plans.push({ id: uid(), date: addDays(t, p[0]), name: p[1], type: p[2], ex: mkEx(p[2]) });
    });
    [[-8, 47], [-6, 55], [-4, 61], [-2, 48]].forEach(function (l) {
      var plan = S.plans.find(function (p) { return p.date === addDays(t, l[0]); });
      S.logs.push({ id: uid(), date: plan.date, planId: plan.id, name: plan.name, type: plan.type, duration: l[1],
        ex: plan.ex.map(function (e) { return { name: e.name, sets: e.sets, reps: e.reps, kg: e.kg, done: true }; }) });

    [[-3, 81.8, 104, 86, 98, 37.5, 59], [-10, 82.4, 104, 86.5, 98, 37.5, 59], [-17, 82.9, 104.5, 87, 98.5, 37, 59.5],

      }).join('');
      return '<div class="entry' + (l.id === UI.lastLogId ? ' new' : '') + '"><button class="entry-head" data-action="log-toggle" data-id="' + l.id + '" aria-expanded="' + open + '">' +
        '<span class="datebox"><span class="dw">' + WD[d.getDay()].toUpperCase() + '</span><span class="dn">' + d.getDate() + '</span></span>' +
        '<span class="stack g4 grow"><span class="row g8"><span class="h3">' + esc(l.name) + '</span>' + (l.id === UI.lastLogId ? '<span class="badge">NEW</span>' : '') + '</span>' +
        '<span class="xs muted">' + l.duration + ' min · ' + logDone(l) + ' exercises · ' + fmtInt(logVolume(l)) + ' kg</span></span>' +
        '<span class="chev muted' + (open ? ' open' : '') + '">' + I.down() + '</span></button>' +
        (open ? '<div class="tbl"><div class="tr th"><span>EXERCISE</span><span class="r">SETS×REPS</span><span class="r">WEIGHT</span></div>' + rows + '</div>' : '') + '</div>';
    }).join('');
    if (!shown.length) entries = '<div class="empty"><span class="base muted">No workouts logged yet. Complete a workout to see it here.</span><a class="btn btn-soft btn-sm" href="#home">Go to today’s workout</a></div>';

    return '<main class="screen"><h1 class="h1">Logs</h1>' +
      '<div class="grid2"><div class="card stat stack g4" style="border-radius:18px;padding:14px"><span class="xs muted">Workouts</span><span class="num">' + shown.length + '</span></div>' +
      '<a class="card accent stack between g4" style="border-radius:18px;padding:14px" href="#progress"><span class="row between"><span class="xs" style="color:var(--accent-soft)">Progress metrics</span><span style="color:var(--accent-soft)">' + I.next(18) + '</span></span>' +
      '<span class="row g8 strong" style="font-size:15px">' + I.trend() + 'Weight &amp; dimensions</span></a></div>' +
      '<div class="row wrap g8" role="group" aria-label="Filter by type">' + filters + '</div>' +
      '<div class="stack g12">' + entries + '</div></main>' + nav('logs');
  }

  /* ---------- Progress ---------- */
  function viewProgress() {
    var sorted = S.metrics.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id; });
    var cutoff = addDays(today(), -30);
    var shown = sorted.filter(function (m) { return UI.progFilter === 'all' || m.date >= cutoff; });
    var cur = sorted[0], first = sorted[sorted.length - 1];
    function since(k, u) {
      if (!cur || cur === first) return cur ? 'First entry' : 'No entries yet';
      var d = fromKey(first.date);
      return delta(cur[k], first[k]) + ' ' + u + ' since ' + d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3);
    }
    if (!UI.progDraft) {
      UI.progDraft = { date: today() };
      METRICS.forEach(function (m) { UI.progDraft[m.key] = cur ? cur[m.key] : ''; });
    }
    var dr = UI.progDraft;
    var form = UI.progForm ?
      '<section class="card accent stack g12"><div class="row between"><span class="eyebrow">New measurement</span><button class="mini" data-action="prog-close" aria-label="Close">' + I.x() + '</button></div>' +
      '<label class="field">Date<input class="input" type="date" value="' + esc(dr.date) + '" data-input="prog" data-field="date"></label>' +
      '<div class="grid2" style="gap:8px">' + METRICS.map(function (m) {
        return '<label class="field">' + m.name + ' (' + m.unit + ')<input class="input num" style="font-size:16px" type="number" inputmode="decimal" min="0" step="0.1" value="' + esc(dr[m.key]) + '" data-input="prog" data-field="' + m.key + '"></label>';
      }).join('') + '</div><button class="btn btn-primary" data-action="prog-save">Save measurement</button></section>' :
      '<button class="btn btn-primary" style="height:52px;border-radius:16px" data-action="prog-open">' + I.plus() + 'Add measurement</button>';

    var filters = [['all', 'All entries'], ['30', 'Last 30 days']].map(function (f) { return '<button class="pill" data-action="prog-filter" data-f="' + f[0] + '" aria-pressed="' + (UI.progFilter === f[0]) + '">' + f[1] + '</button>'; }).join('');
    var entries = shown.map(function (e, idx) {
      var prev = sorted[sorted.indexOf(e) + 1];
      var open = UI.progOpen[e.id] !== undefined ? UI.progOpen[e.id] : idx === 0;
      var d = fromKey(e.date);
      var rows = METRICS.map(function (m) { return '<div class="tr"><span>' + m.name + '</span><span class="r strong">' + r1(e[m.key]) + ' ' + m.unit + '</span><span class="r" style="color:var(--accent-soft)">' + (prev ? delta(e[m.key], prev[m.key]) : '—') + '</span></div>'; }).join('');
      return '<div class="entry' + (e.id === UI.lastMetricId ? ' new' : '') + '"><button class="entry-head" data-action="prog-toggle" data-id="' + e.id + '" aria-expanded="' + open + '">' +
        '<span class="datebox"><span class="dw">' + MONTHS[d.getMonth()].slice(0, 3).toUpperCase() + '</span><span class="dn">' + d.getDate() + '</span></span>' +
        '<span class="stack g4 grow"><span class="row g8"><span class="h3">' + r1(e.weight) + ' kg</span><span class="xs strong" style="color:var(--accent-soft)">' + (prev ? delta(e.weight, prev.weight) + ' kg' : 'First entry') + '</span>' + (e.id === UI.lastMetricId ? '<span class="badge">NEW</span>' : '') + '</span>' +
        '<span class="xs muted">Waist ' + r1(e.waist) + ' · Chest ' + r1(e.chest) + ' · Hips ' + r1(e.hips) + ' cm</span></span>' +
        '<span class="chev muted' + (open ? ' open' : '') + '">' + I.down() + '</span></button>' +
        (open ? '<div class="tbl"><div class="tr th"><span>MEASUREMENT</span><span class="r">VALUE</span><span class="r">CHANGE</span></div>' + rows + '</div>' : '') + '</div>';
    }).join('');
    if (!shown.length) entries = '<div class="empty"><span class="base muted">No measurements in this range. Add one to start tracking.</span></div>';

    return '<main class="screen"><div class="row"><a class="icon-btn" href="#logs" aria-label="Back to logs">' + I.back() + '</a><h1 class="h1 grow" style="font-size:24px">Progress metrics</h1></div>' +
      '<div class="grid2"><div class="card stat stack g4" style="border-radius:18px;padding:14px"><span class="xs muted">Current weight</span><span class="num">' + (cur ? r1(cur.weight) : '—') + ' <span class="unit">kg</span></span><span class="xs" style="color:var(--accent-soft)">' + since('weight', 'kg') + '</span></div>' +
      '<div class="card stat stack g4" style="border-radius:18px;padding:14px"><span class="xs muted">Waist</span><span class="num">' + (cur ? r1(cur.waist) : '—') + ' <span class="unit">cm</span></span><span class="xs" style="color:var(--accent-soft)">' + since('waist', 'cm') + '</span></div></div>' +
      form + '<div class="row wrap g8" role="group" aria-label="Time range">' + filters + '</div><div class="stack g12">' + entries + '</div></main>' + nav('logs');
  }

  /* ---------- render & routing ---------- */
  var app = document.getElementById('app');
  var VIEWS = { home: viewHome, today: viewToday, plan: viewPlan, logs: viewLogs, progress: viewProgress };
  function render() { app.innerHTML = (VIEWS[UI.view] || viewHome)(); }
  function route() {
    var v = (location.hash || '#home').slice(1);
    if (!VIEWS[v]) v = 'home';
    if (v !== 'today') UI.summary = null;
    if (v !== 'plan') { UI.builderId = null; UI.editingId = null; UI.pickId = null; UI.customOpen = false; }
    if (v !== 'progress') { UI.progForm = false; UI.progDraft = null; }
    UI.view = v;
    render();
    window.scrollTo(0, 0);
  }
  function go(v) { if (location.hash === '#' + v) route(); else location.hash = v; }
  var toastTimer;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, 2200);
  }
  function findPlan(id) { return S.plans.find(function (p) { return p.id === id; }); }
  function resetDraft() { UI.draft = { name: '', sets: UI.draft.sets, reps: UI.draft.reps, kg: UI.draft.kg }; }
  function addExercise(name) {
    var b = findPlan(UI.builderId); if (!b || !name.trim()) return false;
    b.ex.push({ id: uid(), name: name.trim(), sets: num(UI.draft.sets, 3), reps: num(UI.draft.reps, 10), kg: num(UI.draft.kg, 0) });
    save(); return true;
  }

  /* ---------- actions ---------- */
  var A = {
    start: function () { if (startSession()) go('today'); },
    'plan-today': function () { UI.selected = today(); var d = new Date(); UI.year = d.getFullYear(); UI.month = d.getMonth(); A['add-plan'](); go('plan'); },
    'toggle-done': function (ds) {
      var e = S.session.ex.find(function (x) { return x.id === +ds.id; }); if (!e) return;
      e.done = !e.done; save(); render();
    },
    discard: function () { if (confirm('Discard this workout? Your entries will not be saved.')) { S.session = null; save(); go('home'); } },
    complete: function () {
      var s = S.session; if (!s) return;
      var log = { id: uid(), date: s.date, planId: s.planId, name: s.name, type: s.type,
        duration: Math.max(1, Math.round((Date.now() - s.startedAt) / 60000)),
        ex: s.ex.map(function (e) { return { name: e.name, sets: num(e.sets), reps: num(e.reps), kg: num(e.kg), done: e.done }; }) };
      S.logs.push(log); S.session = null; UI.lastLogId = log.id; UI.logOpen = {}; UI.logOpen[log.id] = true;
      UI.summary = { name: log.name, done: logDone(log), total: log.ex.length, volume: logVolume(log),
        sets: log.ex.reduce(function (n, e) { return n + (e.done ? e.sets : 0); }, 0) };
      save(); render(); window.scrollTo(0, 0);
    },
    month: function (ds) { var m = UI.month + +ds.dir; if (m < 0) { m = 11; UI.year--; } if (m > 11) { m = 0; UI.year++; } UI.month = m; render(); },
    'pick-day': function (ds) {
      var k = ds.key;
      if (UI.pickId !== null) {
        var src = findPlan(UI.pickId);
        if (src && UI.pickMode === 'copy') {
          S.plans.push({ id: uid(), date: k, name: src.date === k ? src.name + ' (copy)' : src.name, type: src.type,
            ex: src.ex.map(function (e) { return { id: uid(), name: e.name, sets: e.sets, reps: e.reps, kg: e.kg }; }) });
          toast('Copied to ' + fmtShort(k));
        } else if (src) { src.date = k; toast('Moved to ' + fmtShort(k)); }
        UI.pickId = null; UI.pickMode = null; save();
      } else { UI.editingId = null; UI.customOpen = false; }
      UI.selected = k; render();
    },
    pick: function (ds) { UI.pickId = +ds.id; UI.pickMode = ds.mode; UI.editingId = null; render(); },
    'cancel-pick': function () { UI.pickId = null; UI.pickMode = null; render(); },
    'add-plan': function () {
      var id = uid();
      S.plans.push({ id: id, date: UI.selected, name: 'New workout', type: 'Full Body', ex: [] });
      UI.editingId = id; UI.pickId = null; UI.customOpen = false; save(); render();
      var inp = document.querySelector('[data-input="plan-name"][data-id="' + id + '"]'); if (inp) { inp.focus(); inp.select(); }
    },
    'edit-plan': function (ds) { UI.editingId = +ds.id; UI.pickId = null; UI.customOpen = false; render(); },
    'delete-plan': function (ds) {
      var p = findPlan(+ds.id); if (!p) return;
      if (!confirm('Delete ' + p.name + ' on ' + fmtShort(p.date) + '?')) return;
      S.plans = S.plans.filter(function (x) { return x.id !== p.id; }); save(); render();
    },
    'set-type': function (ds) { var p = findPlan(+ds.id); if (p) { p.type = ds.type; save(); render(); } },
    'toggle-custom': function () { UI.customOpen = !UI.customOpen; render(); var i = document.querySelector('[data-input="custom-name"]'); if (i) i.focus(); },
    'add-type': function (ds) {
      var nm = UI.customName.trim(); if (!nm) return;
      var exists = S.types.find(function (t) { return t.name.toLowerCase() === nm.toLowerCase(); });
      if (!exists) { exists = { name: nm, color: CUSTOM_COLORS[Math.max(0, S.types.length - BASE_TYPES.length) % CUSTOM_COLORS.length] }; S.types.push(exists); }
      var p = findPlan(+ds.id); if (p) p.type = exists.name;
      UI.customOpen = false; UI.customName = ''; save(); render();
    },
    'save-plan': function () { UI.editingId = null; UI.customOpen = false; render(); },
    'open-builder': function (ds) { UI.builderId = +ds.id; UI.editingId = null; UI.pickId = null; UI.customOpen = false; UI.draft = { name: '', sets: 3, reps: 10, kg: 20 }; render(); window.scrollTo(0, 0); },
    'builder-back': function () { UI.builderId = null; render(); window.scrollTo(0, 0); },
    'add-ex': function () { if (addExercise(UI.draft.name)) { resetDraft(); render(); var i = document.getElementById('draft-name'); if (i) i.focus(); } },
    'quick-ex': function (ds) { if (addExercise(ds.name)) render(); },
    'ex-up': function (ds) {
      var b = findPlan(UI.builderId); if (!b) return;
      var i = b.ex.findIndex(function (e) { return e.id === +ds.id; }); if (i < 1) return;
      var t = b.ex[i - 1]; b.ex[i - 1] = b.ex[i]; b.ex[i] = t; save(); render();
    },
    'ex-remove': function (ds) { var b = findPlan(UI.builderId); if (!b) return; b.ex = b.ex.filter(function (e) { return e.id !== +ds.id; }); save(); render(); },
    'log-filter': function (ds) { UI.logFilter = ds.f; render(); },
    'log-toggle': function (ds, el) { UI.logOpen.__init = true; UI.logOpen[ds.id] = el.getAttribute('aria-expanded') !== 'true'; render(); },
    'prog-open': function () { UI.progForm = true; render(); },
    'prog-close': function () { UI.progForm = false; UI.progDraft = null; render(); },
    'prog-filter': function (ds) { UI.progFilter = ds.f; render(); },
    'prog-toggle': function (ds, el) { UI.progOpen[ds.id] = el.getAttribute('aria-expanded') !== 'true'; render(); },
    'prog-save': function () {
      var d = UI.progDraft, entry = { id: uid(), date: d.date || today() };
      METRICS.forEach(function (m) { entry[m.key] = num(d[m.key]); });
      S.metrics.push(entry); UI.lastMetricId = entry.id; UI.progOpen = {}; UI.progOpen[entry.id] = true;
      UI.progForm = false; UI.progDraft = null; save(); render(); toast('Measurement saved');
    }
  };

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-action]');
    if (!el || el.disabled) return;
    var fn = A[el.dataset.action];
    if (fn) { ev.preventDefault(); fn(el.dataset, el); }
  });

  document.addEventListener('input', function (ev) {
    var el = ev.target, kind = el.dataset && el.dataset.input; if (!kind) return;
    var v = el.value, f = el.dataset.field;
    if (kind === 'sess' && S.session) { var e = S.session.ex.find(function (x) { return x.id === +el.dataset.id; }); if (e) { e[f] = v; save(); } }
    else if (kind === 'plan-name') { var p = findPlan(+el.dataset.id); if (p) { p.name = v; save(); } }
    else if (kind === 'custom-name') { UI.customName = v; }
    else if (kind === 'draft') { UI.draft[f] = v; }
    else if (kind === 'bex') { var b = findPlan(UI.builderId); if (b) { var x = b.ex.find(function (q) { return q.id === +el.dataset.id; }); if (x) { x[f] = v; save(); } } }
    else if (kind === 'prog' && UI.progDraft) { UI.progDraft[f] = v; }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter') return;
    var el = ev.target, kind = el.dataset && el.dataset.input;
    if (kind === 'draft') { ev.preventDefault(); A['add-ex'](); }
    else if (kind === 'custom-name') { ev.preventDefault(); var btn = document.querySelector('[data-action="add-type"]'); if (btn) A['add-type'](btn.dataset); }
  });

  setInterval(function () {
    var el = document.getElementById('timer');
    if (el && S.session) el.textContent = elapsed(Date.now() - S.session.startedAt);
  }, 1000);

  window.addEventListener('hashchange', route);
  load();
  route();
})();
</script>
</body>
</html>
